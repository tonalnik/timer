name: Test some shit
run-name: "{{ gitea.actor }} is running test"
on: [push]
jobs:
  Run-unit-tests:
     runs-on: docker
     steps:
        - 
          name: Check out repo code
          uses: actions/checkout@v4
        - 
          name: Login to Nexus
          uses: docker/login-action@v3
          with:
            url: ${{ NEXUS_REPO }}
            username: ${{ NEXUS_USER }} 
            password: ${{ NEXUS_PASSWORD }}
         - 
          name: Set up Docker buildx
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: ${{ NEXUS_REPO }}/docker-images/timer:latest


