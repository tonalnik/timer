name: Test some shit
run-name: "{{ gitea.actor }} is running test"
on: [push]
jobs:
  Run-unit-tests:
     runs-on: docker
     steps:
        - name: Check out repo code
          uses: actions/checkout@v4
        - name: Login to Nexus
          uses: docker/login-action@v2.1.0
          with:
            registry: ${{ secrets.NEXUS_REPO }}
            username: ${{ secrets.NEXUS_USER }}
            password: ${{ secrets.NEXUS_PASSWORD }}
        - name: Set up Docker buildx
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: "${{ secrets.NEXUS_REPO }}/docker-images/timer:latest"


