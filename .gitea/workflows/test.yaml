name: Test some shit
run-name: "{{ gitea.actor }} is running test"
on: [push]
jobs:
  Test:
    runs-on: docker
    id: npm-test
    steps:
      - name: Check out repo code
        uses: actions/checkout@v4
      - run: npm ci; npm run build
    
  Build-and-push-image:
     runs-on: docker
     only: 
      - master
     steps:
        - name: Check out repo code
          uses: actions/checkout@v4
        - name: Login to Nexus
          uses: docker/login-action@v3
          with:
            registry: ${{ secrets.HUB_REPO }}
            username: ${{ secrets.HUB_USER }}
            password: ${{ secrets.HUB_PASSWORD }}
        - name: Set up Docker buildx
          uses: docker/build-push-action@v5
          with:
            context: .
            file: ./Dockerfile
            push: true
            tags: |
              ${{ secrets.HUB_REPO }}timer:${{ gitea.sha }}
              ${{ secrets.HUB_REPO }}timer:latest
  Deploy:
    runs-on: docker
    only:
      - master
    if: success()
    steps:
      - name: Deploying via webhook ci
        run: curl -kL -X POST ci.m4ku0j.ru/hooks/deploy-timer



